name: Backend tests

on:
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q
      - name: Check inspection script entrypoint
        working-directory: backend
        run: python -m scripts.inspect_spherex_cube --help
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not scripts:
              raise SystemExit("No inline frontend script found")
          ids = set(re.findall(r'\bid="([^"]+)"', html))
          selectors = set(re.findall(r'\$\(["']([^"']+)["']\)', scripts[0]))
          missing = sorted(selectors - ids)
          if missing:
              raise SystemExit(f"Missing frontend elements: {missing}")
          Path("/tmp/timelens.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/timelens.js
