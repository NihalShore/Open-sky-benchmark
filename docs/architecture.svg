<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc">
  <title id="title">SPHEREx TimeLens architecture</title>
  <desc id="desc">Flow from sky coordinates through the FastAPI service and archive or image-analysis paths to provenance-aware outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#152647"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1500" height="660" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="700">From sky coordinate to traceable evidence</text>
  <text x="74" y="112" fill="#94a3b8" font-family="Inter,Segoe UI,Arial" font-size="17">A modular, archive-backed workflow with explicit scientific limits</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial">
    <rect x="70" y="190" width="280" height="240" rx="20" fill="#10223d" stroke="#38bdf8" stroke-opacity=".65"/>
    <text x="100" y="234" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="2">01 · QUERY</text><text x="100" y="278" fill="#f8fafc" font-size="25" font-weight="700">Sky position</text><text x="100" y="320" fill="#cbd5e1" font-size="17">ICRS RA / Dec</text><text x="100" y="350" fill="#cbd5e1" font-size="17">Search radius</text><text x="100" y="380" fill="#cbd5e1" font-size="17">Archive collection</text>
    <rect x="430" y="190" width="280" height="240" rx="20" fill="#10223d" stroke="#22d3ee" stroke-opacity=".65"/>
    <text x="460" y="234" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="2">02 · API</text><text x="460" y="278" fill="#f8fafc" font-size="25" font-weight="700">FastAPI</text><text x="460" y="320" fill="#cbd5e1" font-size="17">Validated parameters</text><text x="460" y="350" fill="#cbd5e1" font-size="17">Archive adapters</text><text x="460" y="380" fill="#cbd5e1" font-size="17">Provenance responses</text>
    <rect x="790" y="160" width="300" height="145" rx="20" fill="#10223d" stroke="#818cf8" stroke-opacity=".8"/>
    <text x="820" y="202" fill="#a5b4fc" font-size="15" font-weight="700" letter-spacing="2">03A · ARCHIVES</text><text x="820" y="244" fill="#f8fafc" font-size="23" font-weight="700">NASA/IPAC IRSA</text><text x="820" y="275" fill="#cbd5e1" font-size="16">SPHEREx · NEOWISE-R</text>
    <rect x="790" y="340" width="300" height="145" rx="20" fill="#10223d" stroke="#c084fc" stroke-opacity=".8"/>
    <text x="820" y="382" fill="#d8b4fe" font-size="15" font-weight="700" letter-spacing="2">03B · ANALYSIS</text><text x="820" y="424" fill="#f8fafc" font-size="23" font-weight="700">Image pipeline</text><text x="820" y="455" fill="#cbd5e1" font-size="16">WCS · coverage · residuals</text>
    <rect x="1170" y="190" width="260" height="240" rx="20" fill="#10223d" stroke="#34d399" stroke-opacity=".7"/>
    <text x="1200" y="234" fill="#6ee7b7" font-size="15" font-weight="700" letter-spacing="2">04 · OUTPUT</text><text x="1200" y="278" fill="#f8fafc" font-size="24" font-weight="700">Evidence</text><text x="1200" y="320" fill="#cbd5e1" font-size="17">FITS / PNG preview</text><text x="1200" y="350" fill="#cbd5e1" font-size="17">Measurements</text><text x="1200" y="380" fill="#cbd5e1" font-size="17">Masked candidates</text>
  </g>
  <g stroke="url(#line)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 310h80m-12-10 12 10-12 10"/>
    <path d="M710 270h35q20 0 20-20v-18q0-20 25-20h-10m-10-10 10 10-10 10"/>
    <path d="M710 350h35q20 0 20 20v18q0 20 25 20h-10m-10-10 10 10-10 10"/>
    <path d="M1090 232h80m-12-10 12 10-12 10"/>
    <path d="M1090 412h35q25 0 25-25v-95q0-25 20-25m-10-10 10 10-10 10"/>
  </g>
  <rect x="70" y="545" width="1360" height="64" rx="16" fill="#0b1729" stroke="#64748b" stroke-opacity=".4"/>
  <text x="100" y="584" fill="#fbbf24" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700">GUARDRAIL</text>
  <text x="235" y="584" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial" font-size="17">Residual candidates are investigation leads—not moving-object classifications or Planet X detections.</text>
</svg>